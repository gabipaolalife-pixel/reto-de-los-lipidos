<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reto de los Lípidos</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e8f5e9,#e3f2fd);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;color:#17324d}.card{max-width:700px;width:100%;background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 35px #0002}h1{font-size:clamp(30px,7vw,46px);margin:0 0 8px}.sub{color:#607786}.badge{display:inline-block;background:#eef6ff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:bold}.q{font-size:22px;line-height:1.35;margin:20px 0}.opts{display:grid;gap:11px}.opt,.next,.start,.restart{font:inherit;border-radius:14px;padding:15px;border:2px solid #d9e4ea;cursor:pointer}.opt{text-align:left;background:#fbfdff}.opt:hover{transform:translateY(-1px)}.correct{background:#eaf8f0!important;border-color:#39a96b!important}.wrong{background:#fff0f0!important;border-color:#dc5b5b!important}.next,.start,.restart{width:100%;background:#17324d;color:white;border:0;margin-top:15px;font-weight:bold}.feedback{min-height:48px;background:#f4f7f9;border-radius:13px;padding:13px;margin-top:15px;line-height:1.4}.progress{height:9px;background:#e8eef2;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#4c8fbd}.hidden{display:none}.result{font-size:32px;font-weight:bold;margin:18px 0}.small{font-size:13px;color:#71818c}
</style></head><body><main class="card">
<section id="start"><span class="badge">🧪 ACTIVIDAD INTERACTIVA</span><h1>Reto de los Lípidos</h1><p class="sub">10 preguntas sobre insaturación, Lugol, ácidos grasos y nutrición.</p><p>1 punto por pregunta · máximo 10 puntos.</p><button class="start" onclick="start()">Comenzar reto</button></section>
<section id="game" class="hidden"><span class="badge" id="count"></span><div class="progress"><div class="bar" id="bar"></div></div><b id="pts">Puntaje: 0</b><div class="q" id="q"></div><div class="opts" id="opts"></div><div class="feedback" id="fb"></div><button class="next hidden" id="next" onclick="next()">Siguiente</button></section>
<section id="end" class="hidden"><span class="badge">🏆 RETO COMPLETADO</span><h1>¡Buen trabajo!</h1><div class="result" id="res"></div><p id="msg"></p><p class="small">Puedes volver a intentarlo para superar tu puntuación.</p><button class="restart" onclick="start()">Jugar nuevamente</button></section>
</main>
<script>
const Q=[
["¿Qué muestra presentó el mayor consumo de Lugol?",["Manteca de cerdo","Margarina","Aceite de oliva","Aceite reutilizado"],3,"El aceite reutilizado presentó 60 gotas."],
["¿Cuántas gotas de Lugol se registraron para el aceite de oliva?",["30","40","50","60"],2,"El aceite de oliva presentó 50 gotas."],
["¿Cuál fue la utilidad del Tubo B (blanco)?",["Aumentar el Lugol","Determinar la cantidad de grasa","Servir como referencia en ausencia de una muestra lipídica","Calentar las muestras"],2,"El blanco permitió observar el comportamiento del reactivo sin muestra lipídica."],
["¿Qué estructura de los ácidos grasos reacciona con el yodo?",["Enlace simple C–C","Grupo amino","Doble enlace C=C","Grupo fosfato"],2,"La reacción estudiada se relaciona con los dobles enlaces C=C."],
["¿Cuál fue el orden de mayor a menor consumo de Lugol?",["Manteca → margarina → oliva → reutilizado","Reutilizado → oliva → margarina → manteca","Oliva → reutilizado → manteca → margarina","Margarina → manteca → reutilizado → oliva"],1,"Los resultados fueron 60, 50, 40 y 30 gotas."],
["¿Qué puede ocurrir con un aceite sometido repetidamente a calentamiento y reutilización?",["Su composición permanece igual","Puede experimentar oxidación, hidrólisis y polimerización","Se convierte en agua","Pierde todos sus ácidos grasos"],1,"El informe señala que estos procesos pueden modificar la composición del aceite."],
["¿Cuál describe mejor una configuración cis?",["Cadena completamente lineal","Hidrógenos en lados opuestos","Hidrógenos del mismo lado y cadena con curvatura","No contiene dobles enlaces"],2,"La configuración cis genera una curvatura en la cadena."],
["¿Cómo se caracteriza generalmente una configuración trans?",["Cadena muy curvada","Disposición más lineal y rígida, semejante a ácidos grasos saturados","No tiene hidrógenos","Solo aparece en grasas animales"],1,"La configuración trans da una disposición más lineal y rígida."],
["¿Qué puede ocurrir con un consumo elevado de ácidos grasos saturados?",["Siempre es beneficioso","No tiene relación cardiovascular","Puede contribuir a un perfil lipídico menos favorable y aumentar el riesgo cardiovascular","Es equivalente a consumir poliinsaturados"],2,"El informe relaciona el consumo elevado con un perfil lipídico menos favorable."],
["¿Cuál es la ecuación general entre un doble enlace y el yodo?",["R–CH₂–CH₂–R′ + I₂ → productos","R–CH=CH–R′ + H₂O → productos","R–CH=CH–R′ + I₂ → R–CHI–CHI–R′","R–COOH + I₂ → productos"],2,"El yodo se adiciona al doble enlace."]
];
let i=0,s=0;
function start(){i=0;s=0;document.getElementById("start").classList.add("hidden");document.getElementById("end").classList.add("hidden");document.getElementById("game").classList.remove("hidden");show()}
function show(){let x=Q[i];document.getElementById("count").textContent=`Pregunta ${i+1} de 10`;document.getElementById("bar").style.width=(i*10)+"%";document.getElementById("pts").textContent=`Puntaje: ${s}`;document.getElementById("q").textContent=x[0];document.getElementById("fb").textContent="";document.getElementById("next").classList.add("hidden");let o=document.getElementById("opts");o.innerHTML="";x[1].forEach((t,n)=>{let b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+n)+". "+t;b.onclick=()=>ans(n);o.appendChild(b)})}
function ans(n){let x=Q[i],bs=[...document.querySelectorAll(".opt")];bs.forEach((b,k)=>{b.disabled=true;if(k===x[2])b.classList.add("correct")});if(n===x[2]){s++;document.getElementById("fb").textContent="✅ ¡Correcto! "+x[3]}else{bs[n].classList.add("wrong");document.getElementById("fb").textContent="❌ Incorrecto. "+x[3]}document.getElementById("pts").textContent=`Puntaje: ${s}`;document.getElementById("next").textContent=i===9?"Ver resultado":"Siguiente";document.getElementById("next").classList.remove("hidden")}
function next(){if(i===9){finish()}else{i++;show()}}
function finish(){document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("res").textContent=`${s} / 10 puntos`;document.getElementById("msg").textContent=s>=9?"🧬 ¡Experto en lípidos!":s>=7?"🔬 ¡Investigador destacado!":s>=5?"🧪 ¡Buen camino!":"📚 ¡A repasar y volver a intentarlo!"}
</script></body></html>
